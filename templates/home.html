<!DOCTYPE html>
<html>
<head>
    <title>Save the Date</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #fff0f5;
            padding: 30px;
        }
        h1 { color: #b30059; }
        .countdown {
            font-size: 22px;
            margin-top: 20px;
        }
        .footer {
            margin-top: 40px;
            font-size: 14px;
            color: gray;
        }
        a {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            background: #b30059;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <h1>Save the Date</h1>
    <h2>Ragul & Kavini</h2>
    <p>📍 Sai Vivagha Mahal</p>

    <div class="countdown" id="countdown"></div>

<script>
    // 🔔 CHANGE THIS DATE TO YOUR WEDDING DATE
    const weddingDate = new Date("2026-09-15T09:00:00").getTime();

    function updateCountdown() {
        const now = new Date().getTime();
        const diff = weddingDate - now;

        if (diff <= 0) {
            document.getElementById("countdown").innerHTML =
                "🎉 Today is the Big Day!";
            return;
        }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
        const minutes = Math.floor((diff / (1000 * 60)) % 60);
        const seconds = Math.floor((diff / 1000) % 60);

        document.getElementById("countdown").innerHTML =
            `⏰ ${days} Days ${hours} Hours ${minutes} Minutes ${seconds} Seconds`;
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
</script>

    <p><b>Total Guests Registered:</b> {{ total }}</p>

    <a href="/rsvp">👉 Confirm Attendance</a>

    <div class="footer">
        © Sharp Event Management – 36 Years of Trusted Service
    </div>

</body>
</html>
